name = "tong-games-feedback"
main = "src/index.js"
compatibility_date = "2026-11-24"
account_id = "57fb23076544a3be231ee74c0d1df0f9"
workers_dev = true

# 建立 D1 後，把下一行換成真正的 database_id：
#   npx wrangler d1 create tong-games-feedback
[[d1_databases]]
binding = "DB"
database_name = "tong-games-feedback"
database_id = "3be41362-d40e-4eb7-af40-bfaf2803d17d"
migrations_dir = "migrations"

# 填 GitHub Pages 的 origin，不含路徑。本機測試用 wrangler dev --var 覆寫。
# 例：https://<github-user>.github.io
[vars]
CORS_ORIGINS = "http://127.0.0.1:8765,http://localhost:8765,https://yutong-huaichu-wedding.github.io"
